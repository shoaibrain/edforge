name: secret-scan

# Runs gitleaks against pull request diffs and commits pushed to main.
# Catches re-introduction of credentials, API keys, JWTs, and EdForge-
# specific operational identifiers (account IDs, prod tenant UUID,
# CloudFront domains) — see .gitleaks.toml for the rule set.
#
# Mode: diff-only. Pull-request runs scan only the commits in the PR;
# push-to-main runs scan only the new commits. The pre-existing baseline
# from before this gate was installed is intentionally NOT scanned —
# that's addressed by the S2 history rewrite, not by this CI gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history fetch is required so gitleaks-action can resolve
          # PR base ↔ head commit ranges. Without this, the action falls
          # back to scanning the entire tree on the runner's shallow
          # clone and produces wrong diff ranges.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # The action reads .gitleaks.toml at repo root by default; no
          # explicit config arg needed. GITLEAKS_LICENSE is only required
          # for organization accounts on the paid tier; left unset here
          # for the public-repo free tier.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the scanner binary. The action's default (8.24.3) only
          # honors the legacy singular [allowlist] table and silently
          # IGNORES every [[allowlists]] entry in .gitleaks.toml — the
          # existing entries never actually worked in CI (masked by
          # diff-only scanning). 8.30.x parses [[allowlists]] as designed.
          GITLEAKS_VERSION: "8.30.1"
          # Fail the workflow run if any leak is detected. Default
          # behavior is already fail-on-leak; we make it explicit so a
          # future config change doesn't silently disable the gate.
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
