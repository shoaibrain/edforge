name: abac-conformance

# CONF.1 — RBAC/ABAC conformance merge gate. Runs, as one named gate
# (`npm run test:abac`), the specs that encode every authorization decision:
# the role × resource permission matrices (identity + academics), the
# PermissionGuard specs, the finance data-scope / ownership specs, the JWT
# front-door specs, and the role-user fixture. Fails the build if any role's
# allow/deny decision regresses. Unit-mode (mocked DDB/identity) — no AWS needed.
# See docs/alpha-launch/rbac-abac-epic.md (CONF.1 / R0.2).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  abac-conformance:
    name: abac-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Read-only gate — no pushes — so don't leave the token on the runner.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types (jest resolves @aibrains/shared-types/dist)
        run: cd packages/shared-types && npm run build

      - name: ABAC conformance gate (role×resource matrices + guards + data-scope + ownership)
        run: npm run test:abac
